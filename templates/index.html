const _ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}}
let currentLang=_ls.get('awg_lang')||'en';

function t(key){ return (I18N[currentLang]||I18N.ru)[key]||key; }

function applyI18n(){
  const L=I18N[currentLang]||I18N.ru;
  // data-i18n → textContent
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n; if(L[k]!==undefined) el.textContent=L[k];
  });
  // data-i18n-html → innerHTML
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const k=el.dataset.i18nHtml; if(L[k]!==undefined) el.innerHTML=L[k];
  });
  // data-i18n-ph → placeholder
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const k=el.dataset.i18nPh; if(L[k]!==undefined) el.placeholder=L[k];
  });
  // data-i18n-tooltip → data-tooltip (for CSS tooltip)
  document.querySelectorAll('[data-i18n-tooltip]').forEach(el=>{
    const k=el.dataset.i18nTooltip; if(L[k]!==undefined) el.setAttribute('data-tooltip',L[k]);
  });
  // legacy data-key
  document.querySelectorAll('.i18n[data-key]').forEach(el=>{
    const k=el.dataset.key; if(L[k]!==undefined) el.textContent=L[k];
  });
  document.getElementById('lang-btn').textContent=currentLang==='ru'?'EN':'RU';
}

function toggleLang(){
  currentLang=currentLang==='ru'?'en':'ru';
  _ls.set('awg_lang',currentLang);
  applyI18n();
}

const PROFILES=[
  {id:'quic_initial',label:'QUIC Initial'},{id:'quic_0rtt',label:'QUIC 0-RTT'},
  {id:'tls_client_hello',label:'TLS 1.3'},{id:'wireguard_noise',label:'Noise_IK'},
  {id:'dtls',label:'DTLS 1.3'},{id:'http3',label:'HTTP/3'},
  {id:'sip',label:'SIP'},{id:'tls_to_quic',label:'TLS → QUIC'},
  {id:'quic_burst',label:'QUIC Burst'},{id:'dns_query',label:'DNS Query'},
  {id:'random',label:'Random 🎲'},
];

document.addEventListener('DOMContentLoaded',()=>{
  applyTheme();
  applyI18n();
  buildProfileGrid();
  loadStatus();
  loadSystemLogs();
  loadSslStatus();
  loadEndpointSetting();
  // Auto-detect system theme if no stored preference
  if(!_ls.get('awg_theme')){
    const mq=window.matchMedia('(prefers-color-scheme: light)');
    if(mq.matches){ currentTheme='light'; applyTheme(); }
    mq.addEventListener('change',e=>{ currentTheme=e.matches?'light':'dark'; applyTheme(); });
  }
  document.querySelectorAll('.nav-item[data-section]').forEach(n=>{
    n.addEventListener('click',()=>{ navigate(n.dataset.section); });
  });
  document.getElementById('peer-modal').addEventListener('click',e=>{
    if(e.target===document.getElementById('peer-modal')) closeModal();
  });
  // Auto-refresh peers every 30s when on peers tab
  setInterval(()=>{
    const peersSection=document.getElementById('s-peers');
    if(peersSection&&peersSection.classList.contains('active')) loadPeers();
  },30000);

  // Auto-refresh dashboard status every 15s when on dashboard tab - otherwise
  // "Active Now" / RAM / CPU stay frozen at whatever they were on last load,
  // and a peer that just went offline keeps showing as active indefinitely.
  setInterval(()=>{
    const dashSection=document.getElementById('s-dashboard');
    if(dashSection&&dashSection.classList.contains('active')) loadStatus();
  },15000);

  // Restore traffic stats toggle state
  const savedTraffic=_ls.get('awg_traffic_stats');
  if(savedTraffic==='0'){
    const tog=document.getElementById('traffic-toggle');
    if(tog){tog.checked=false;}
    document.querySelectorAll('.col-traffic').forEach(el=>el.style.display='none');
  }

  // Animate CPS details arrow
  const det=document.querySelector('details');
  if(det){
    det.addEventListener('toggle',()=>{
      const arrow=document.getElementById('cps-arrow');
      if(arrow) arrow.style.transform=det.open?'rotate(90deg)':'';
    });
  }
});

function navigate(sec){
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  const nav=document.querySelector(`.nav-item[data-section="${sec}"]`);
  if(nav) nav.classList.add('active');
  const s=document.getElementById('s-'+sec);
  if(s) s.classList.add('active');
  if(sec==='peers') loadPeers();
  if(sec==='rawconf') loadRawConf();
  if(sec==='dashboard'){loadStatus();loadSystemLogs();}
  if(sec==='settings'){loadSettingsForm();loadSslStatus();}
  if(sec==='server') loadServerSetup();
}

function buildProfileGrid(){
  const g=document.getElementById('profile-grid');
  g.innerHTML='';
  PROFILES.forEach(p=>{
    const b=document.createElement('div');
    b.className='profile-btn'+(p.id===selectedProfile?' selected':'');
    b.textContent=p.label;
    b.onclick=()=>{
      selectedProfile=p.id;
      g.querySelectorAll('.profile-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    };
    g.appendChild(b);
  });
}

async function api(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(path,opts);
  if(!r.ok){const e=await r.json().catch(()=>({error:r.statusText}));throw new Error(e.error||r.statusText);}
  return r.json();
}

function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className=`toast-msg ${type}`;
  el.textContent=msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(),3500);
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function safeKey(k){ return String(k).replace(/[+/=]/g,'_'); }

function renderParam(k,v){
  const long=String(v).length>32;
  return `<div class="param-item"><div class="param-key">${escapeHtml(k)}</div><div class="param-val${long?' long':''}">${escapeHtml(v)}</div></div>`;
}

function flatParams(r){
  const skip=['version','profile','intensity'];
  return Object.entries(r).filter(([k])=>!skip.includes(k)&&!k.endsWith('s')&&r[k]!==undefined).reduce((a,[k,v])=>{a[k]=v;return a;},{});
}

function renderParams(obj){
  return Object.entries(obj).map(([k,v])=>renderParam(k,v)).join('');
}

async function loadStatus(){
  try{
    const s=await api('GET','/api/server/status');

    // ── Connection status banner ─────────────────────────────────────────────
    const dot=document.getElementById('conn-status-dot');
    const lbl=document.getElementById('conn-status-label');
    const ipEl=document.getElementById('conn-status-ip');
    const awgBadge=document.getElementById('awg-status-badge');

    // "Connected to AmneziaWG Web UI" — always true if we got a response
    dot.style.background='var(--ok)';
    dot.style.boxShadow='0 0 0 4px rgba(74,222,128,.25)';
    lbl.textContent=t('conn_connected');

    // Show public IP if detected
    const pip=s.public_ip||'';
    ipEl.textContent=pip && pip!=='YOUR_SERVER_IP'
      ? '🌐 '+pip
      : t('conn_ip_unknown');

    // AWG daemon status (separate)
    if(s.running){
      awgBadge.textContent=t('awg_running');
      awgBadge.className='badge ok';
    } else if(!s.configured){
      awgBadge.textContent=t('awg_not_configured');
      awgBadge.className='badge warn';
    } else {
      awgBadge.textContent=t('awg_stopped');
      awgBadge.className='badge danger';
    }

    // ── Stats grid ───────────────────────────────────────────────────────────
    const extraCards=[
      s.uptime_str?`<div class="stat-card"><div class="stat-label">UPTIME</div><div class="stat-value small">${escapeHtml(s.uptime_str)}</div></div>`:'',
      s.version?`<div class="stat-card"><div class="stat-label">VERSION</div><div class="stat-value small">${escapeHtml(s.version)}</div></div>`:'',
      s.cpu_pct!==undefined?`<div class="stat-card"><div class="stat-label">CPU</div><div class="stat-value ${s.cpu_pct>80?'danger':s.cpu_pct>50?'':''}">${s.cpu_pct}%</div><div class="progress-bar"><div style="width:${s.cpu_pct}%;background:${s.cpu_pct>80?'var(--danger)':s.cpu_pct>50?'var(--warning)':'var(--accent-grad)'}"></div></div></div>`:'',
      s.mem_pct!==undefined?`<div class="stat-card"><div class="stat-label">RAM</div><div class="stat-value small">${escapeHtml(s.mem_used_str||'—')} / ${escapeHtml(s.mem_total_str||'—')}</div><div class="progress-bar"><div style="width:${s.mem_pct||0}%"></div></div></div>`:'',
      s.rx_24h?`<div class="stat-card"><div class="stat-label">RX 24H</div><div class="stat-value ok">${escapeHtml(s.rx_24h)}</div></div>`:'',
      s.tx_24h?`<div class="stat-card"><div class="stat-label">TX 24H</div><div class="stat-value" style="color:var(--warn)">${escapeHtml(s.tx_24h)}</div></div>`:'',
    ].join('');
    document.getElementById('stats-grid').innerHTML=`
      <div class="stat-card"><div class="stat-label">${t('stat_interface')}</div><div class="stat-value accent">${escapeHtml(s.interface)}</div></div>
      <div class="stat-card"><div class="stat-label">${t('stat_address')}</div><div class="stat-value" style="font-size:14px">${escapeHtml(s.address||'—')}</div></div>
      <div class="stat-card"><div class="stat-label">${t('stat_port')}</div><div class="stat-value">${escapeHtml(String(s.listen_port))}</div></div>
      <div class="stat-card"><div class="stat-label">${t('stat_total_peers')}</div><div class="stat-value accent">${s.peer_count}</div></div>
      <div class="stat-card"><div class="stat-label">${t('stat_active_now')}</div><div class="stat-value ok">${s.active_peers}</div></div>
      <div class="stat-card"><div class="stat-label">${t('stat_total_rx')}</div><div class="stat-value accent2">${escapeHtml(s.total_rx||'0 B')}</div></div>
      <div class="stat-card"><div class="stat-label">${t('stat_total_tx')}</div><div class="stat-value" style="color:var(--warn)">${escapeHtml(s.total_tx||'0 B')}</div></div>
      <div class="stat-card"><div class="stat-label">${t('stat_endpoint')}</div><div class="stat-value" style="font-size:12px">${escapeHtml(s.endpoint||'—')}</div></div>
      ${extraCards}
    `;

    // ── Alerts ───────────────────────────────────────────────────────────────
    const ac=document.getElementById('alerts-container');
    if(ac) ac.innerHTML=(s.alerts||[]).map(a=>
      `<div class="alert alert-${a.level==='error'?'error':'warn'}">⚠ ${escapeHtml(a.msg)}</div>`
    ).join('');

    // ── CPS info bar ─────────────────────────────────────────────────────────
    const cpsBar=document.getElementById('cps-info-bar');
    if(cpsBar && s.conf_params){
      const p=s.conf_params;
      document.getElementById('s-cps-profile').textContent=s.cps_profile||'—';
      document.getElementById('s-h1').textContent=p.H1||'—';
      document.getElementById('s-jc').textContent=p.Jc||'—';
      document.getElementById('s-jmin').textContent=p.Jmin||'—';
      document.getElementById('s-jmax').textContent=p.Jmax||'—';
      cpsBar.style.display='flex';
    }

    // ── AWG 3.1 extras ────────────────────────────────────────────────────
    loadAwg31(s);
  }catch(e){toast(e.message,'err');}
}

async function applyConfig(){

      toast('⚠ '+r.warn,'warn');

    loadStatus();

async function initServer(){
  try{
    // Save endpoint first
    const ep=document.getElementById('sv-endpoint').value.trim();
    await api('POST','/api/settings/endpoint',{endpoint:ep});
    const r=await api('POST','/api/server/init',{
      version:document.getElementById('sv-version').value,
      intensity:document.getElementById('sv-intensity').value,
      profile:document.getElementById('sv-profile').value,
      address:document.getElementById('sv-address').value,
      listen_port:parseInt(document.getElementById('sv-port').value),
      browser_profile:document.getElementById('sv-browser').value,
      junk_level:parseInt(document.getElementById('sv-jc').value),
      router_mode:document.getElementById('sv-router-mode').checked,
      use_extreme_max:document.getElementById('sv-extreme-max').checked,
      regenerate_keys:document.getElementById('sv-regen-keys').checked,
      auto_start:document.getElementById('sv-auto-start').checked,
    });
    // Auto-apply immediately after init
    await api('POST','/api/server/apply');
    const pb=document.getElementById('sv-pubkey-block');
    pb.innerHTML='<button class="copy-btn" onclick="copyCode(\'sv-pubkey-block\')">Copy</button>'+escapeHtml(r.public_key||'—');
    document.getElementById('sv-params-grid').innerHTML=renderParams(flatParams(r.awg_params));
    document.getElementById('sv-result').style.display='block';
    // Update displayed endpoint
    document.getElementById('sv-endpoint-current').textContent=r.endpoint||'auto';
    toast(t('applied'));
  }catch(e){toast(e.message,'err');}
}

async function loadEndpointSetting(){
  try{
    const s=await api('GET','/api/settings');
    const inp=document.getElementById('sv-endpoint');
    if(inp && s.endpoint) inp.value=s.endpoint;
    const cur=document.getElementById('sv-endpoint-current');
    if(cur) cur.textContent=s.endpoint||'auto ('+t('label_endpoint_hint')+')';
  }catch(e){}
}

async function loadServerSetup(){
  await loadEndpointSetting();
  try{
    const s=await api('GET','/api/server/status');
    loadAwg31(s);
    if(s.configured && s.public_key){
      const pb=document.getElementById('sv-pubkey-block');
      pb.innerHTML='<button class="copy-btn" onclick="copyCode(\'sv-pubkey-block\')">Copy</button>'+escapeHtml(s.public_key);
      // Load AWG params from rawconf
      const rc=await api('GET','/api/server/rawconf');
      const params=parseParamsFromConf(rc.conf||'');
      document.getElementById('sv-params-grid').innerHTML=params?renderParams(params):'';
      document.getElementById('sv-result').style.display='block';
    }
  }catch(e){}
}

function parseParamsFromConf(conf){
  const map={};
  const keys=['H1','H2','H3','H4','S1','S2','S3','S4','Jc','Jmin','Jmax'];
  for(const k of keys){
    const m=conf.match(new RegExp('^'+k+'\\s*=\\s*(.+)$','m'));
    if(m) map[k]=m[1].trim();
  }
  return Object.keys(map).length?map:null;
}

async function saveAwg31(){
  const enable=document.getElementById('awg31-enabled').checked;
  const padding=document.getElementById('awg31-padding').value.trim();
  const rekeyAfter=document.getElementById('awg31-rekey-after').value.trim();
  const rekeyTimeout=document.getElementById('awg31-rekey-timeout').value.trim();
  const rejectAfter=document.getElementById('awg31-reject-after').value.trim();
  const keepalive=document.getElementById('awg31-keepalive').value.trim();
  const maxHandshake=document.getElementById('awg31-max-handshake').value.trim();
  if(enable){
    const rangeFields={
      'Content Padding Addition':padding,'Rekey After Time':rekeyAfter,'Rekey Timeout':rekeyTimeout,
      'Reject After Time':rejectAfter,'Keepalive Timeout':keepalive,'Max Handshake Attempts':maxHandshake,
    };
    for(const label in rangeFields){
      const val=rangeFields[label];
      if(val && !AWG31_RANGE_RE.test(val)){
        toast(label+': expected "N" or "min-max"','err');
        return;
      }
    }
  }
  try{
    const r=await api('POST','/api/server/awg31',{
      enable_awg31:enable,
      random_trailers:document.getElementById('awg31-random-trailers').checked,
      disable_cookies:document.getElementById('awg31-disable-cookies').checked,
      regenerate_header_key:document.getElementById('awg31-regen-hpk').checked,
      content_padding_addition:padding,
      rekey_after_time:rekeyAfter,
      rekey_timeout:rekeyTimeout,
      reject_after_time:rejectAfter,
      keepalive_timeout:keepalive,
      max_handshake_attempts:maxHandshake,
    });
    const statusEl=document.getElementById('awg31-status');
    statusEl.textContent=(r.hot_applied?'Applied live via UAPI.':'Saved to config (full Apply Config needed to hot-apply).')+((r.logs&&r.logs.length)?' '+r.logs.join(' '):'');
    document.getElementById('awg31-regen-hpk').checked=false;
    toast(t('applied'));
    loadStatus();
  }catch(e){toast(e.message,'err');}
}

function buildSnippet(r){
  const v=r.version||'2.0';
  const lines=['[Interface]'];
  if(v==='2.0'||v==='3.1'){lines.push('H1 = '+r.H1,'H2 = '+r.H2,'H3 = '+r.H3,'H4 = '+r.H4);}
  else{lines.push('H1 = '+r.H1s,'H2 = '+r.H2s,'H3 = '+r.H3s,'H4 = '+r.H4s);}
  lines.push('S1 = '+r.S1,'S2 = '+r.S2);
  if(v==='2.0'||v==='3.1'){lines.push('S3 = '+r.S3,'S4 = '+r.S4);}
  lines.push('Jc = '+r.Jc,'Jmin = '+r.Jmin,'Jmax = '+r.Jmax);
  if(v==='2.0'||v==='3.1'){
    ['I1','I2','I3','I4','I5'].forEach(t=>{if(r[t])lines.push(t+' = '+r[t]);});
  }
  return lines.join('\n');
}

function copyGenResult(){
  if(!lastGenResult){toast(t('err_nothing_generated'),'err');return;}
  navigator.clipboard.writeText(buildSnippet(lastGenResult));
  toast(t('copied'));
}

async function loadPeers(){
  try{
    const peers=await api('GET','/api/peers');
    peersCache=peers;
    const tb=document.getElementById('peers-tbody');
    document.getElementById('peers-count').textContent=peers.length;

    // Record traffic history for charts
    const now=Date.now();
    peers.forEach(p=>{
      if(!trafficHistory[p.public_key]) trafficHistory[p.public_key]=[];
      const h=trafficHistory[p.public_key];
      h.push({t:now,rx:p.transfer_rx_bytes||0,tx:p.transfer_tx_bytes||0});
      if(h.length>60) h.shift();
    });

    if(!peers.length){
      tb.innerHTML=`<tr><td colspan="7" style="color:var(--muted);text-align:center;padding:24px">${t('peers_empty')}</td></tr>`;
      return;
    }
    const showTraffic=document.getElementById('traffic-toggle').checked;
    const activeKeys=peers.filter(p=>!p.disabled).map(p=>p.public_key);
    tb.innerHTML=peers.map((p,i)=>{
      const isSuspended=!!p.disabled;
      const statusDot=isSuspended
        ?`<span class="dot inactive"></span><span class="badge suspended" style="font-size:10px">${t('peer_suspended')}</span>`
        :p.active
          ?`<span class="dot active"></span><span style="color:var(--success)">${t('peer_active')}</span>`
          :`<span class="dot inactive"></span><span style="color:var(--text-muted)">${t('peer_offline')}</span>`;
      const ip=(p.allowed_ips||'').replace('/32','');
      const expiryBadge=p.expiry?`<span class="badge ${p.expired?'danger':'warn'}" style="margin-left:4px;font-size:10px">${p.expired?(I18N[currentLang]||I18N.ru).expired_badge:p.expiry}</span>`:'';
      const suspendBtn=isSuspended
        ?`<button class="btn btn-ghost btn-sm" title="${t('btn_resume')}" onclick="resumePeer(${i})">▶</button>`
        :`<button class="btn btn-ghost btn-sm" title="${t('btn_suspend')}" onclick="suspendPeer(${i})">⏸</button>`;
      const actions=`<div class="btn-group">
        <button class="btn btn-ghost btn-sm" title="${t('btn_view_conf')}" onclick="viewPeerConf(${i})">📋</button>
        <button class="btn btn-ghost btn-sm" title="${t('btn_download_conf')}" onclick="downloadPeerConf(${i})">⬇</button>
        <button class="btn btn-ghost btn-sm" title="${t('btn_qr_code')}" onclick="showPeerQR(${i})">📱</button>
        <button class="btn btn-ghost btn-sm" title="${t('btn_otl')}" onclick="createOTL(${i})">🔗</button>
        <button class="btn btn-ghost btn-sm" title="${t('btn_traffic_chart')}" onclick="showTrafficChart(${i})">📈</button>
        ${suspendBtn}
        <button class="btn btn-danger btn-sm" title="${t('btn_delete')}" onclick="deletePeer('${p.public_key}')">🗑</button>
      </div>`;
      return `<tr class="${isSuspended?'peer-suspended':''}">
        <td style="padding:6px 8px">${peerAvatar(p.name)}</td>
        <td><div class="peer-status">${statusDot}</div></td>
        <td><strong>${escapeHtml(p.name||'—')}</strong>${expiryBadge}<span class="peer-flag" id="flag-${safeKey(p.public_key)}"></span><span class="peer-latency" id="ping-${safeKey(p.public_key)}"></span></td>
        <td><code style="font-size:12px">${escapeHtml(ip)}</code></td>
        <td style="font-size:12px;color:var(--text-muted)">${(()=>{const hs=p.last_handshake||p.handshake_str;return !hs||hs==='Never'?t('peer_never'):hs==='Active'?`<span style="color:var(--success)">${t('peer_active')}</span>`:escapeHtml(hs);})()}</td>
        <td class="col-traffic" style="${showTraffic?'':'display:none'}"><span style="color:#22d3ee">↓ ${escapeHtml(p.transfer_rx||'0 B')}</span> / <span style="color:var(--warning)">↑ ${escapeHtml(p.transfer_tx||'0 B')}</span></td>
        <td>${actions}</td>
      </tr>`;
    }).join('');
    // Lazy-load geo + ping for active peers
    activeKeys.forEach(k=>loadPeerExtras(k));
  }catch(e){toast(e.message,'err');}

async function loadPeerExtras(key){
  const sk=safeKey(key);
  const flagEl=document.getElementById('flag-'+sk);
  const pingEl=document.getElementById('ping-'+sk);
  if(!flagEl&&!pingEl) return;
  try{
    const [geo,ping]=await Promise.all([
      fetch('/api/peers/'+encodeURIComponent(key)+'/geo').then(r=>r.ok?r.json():{}),
      fetch('/api/peers/'+encodeURIComponent(key)+'/ping').then(r=>r.ok?r.json():{}),
    ]);
    if(flagEl && geo.flag) flagEl.textContent=' '+geo.flag;
    if(pingEl){
      const ms=ping.latency_ms;
      pingEl.textContent=ms!==undefined&&ms>=0?ms.toFixed(0)+'ms':'';
    }
  }catch(_){}
}

async function showTrafficChart(idx){
  const p=peersCache[idx];
  if(!p) return;
  const fmtBytes=v=>v>=1073741824?`${(v/1073741824).toFixed(2)} GB`:v>=1048576?`${(v/1048576).toFixed(1)} MB`:v>=1024?`${(v/1024).toFixed(0)} KB`:`${v} B`;
  openModal('📈 Traffic: '+escapeHtml(p.name||p.public_key.slice(0,8)),
    `<div id="chart-loading" style="text-align:center;padding:20px;color:var(--muted)">Loading 24h data…</div>`+
    `<canvas id="traffic-canvas" height="200" style="display:none"></canvas>`+
    `<p style="font-size:11px;color:var(--muted);margin-top:8px;text-align:center">24h rolling window</p>`
  );

  // Try API first (24h server-side history), fallback to local session history
  let labels=[], rxData=[], txData=[];
  try{
    const raw=await fetch('/api/peers/'+encodeURIComponent(p.public_key)+'/traffic').then(r=>r.ok?r.json():[]);
    if(raw&&raw.length){
      labels=raw.map(x=>new Date((x.ts||x.t)*1000).toLocaleTimeString());
      rxData=raw.map(x=>x.rx||0);
      txData=raw.map(x=>x.tx||0);
    }
  }catch(_){}

  // Fallback: local traffic history collected per-refresh
  if(!labels.length){
    const h=trafficHistory[p.public_key]||[];
    labels=h.map(x=>new Date(x.t).toLocaleTimeString());
    rxData=h.map(x=>x.rx);
    txData=h.map(x=>x.tx);
  }

  const loadingEl=document.getElementById('chart-loading');
  const canvas=document.getElementById('traffic-canvas');
  if(!canvas) return;
  if(loadingEl) loadingEl.style.display='none';
  canvas.style.display='block';

  if(!labels.length){
    if(loadingEl){ loadingEl.textContent='No traffic data yet'; loadingEl.style.display='block'; }
    return;
  }

  if(trafficChart) trafficChart.destroy();
  trafficChart=new Chart(canvas,{
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'↓ RX',data:rxData,borderColor:'#4ecdc4',backgroundColor:'rgba(78,205,196,.1)',tension:.3,fill:true},
        {label:'↑ TX',data:txData,borderColor:'#ffa502',backgroundColor:'rgba(255,165,2,.1)',tension:.3,fill:true},
      ]
    },
    options:{
      responsive:true,
      plugins:{legend:{labels:{color:'#e8eaf0'}},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fmtBytes(ctx.raw)}`}}},
      scales:{
        x:{ticks:{color:'#8890a4',maxTicksLimit:8},grid:{color:'#2e3156'}},
        y:{ticks:{color:'#8890a4',callback:v=>fmtBytes(v)},grid:{color:'#2e3156'}}
      }
    }
  });

  // Keep the chart live while the modal stays open - it used to draw one
  // static snapshot and never update again, so it looked "frozen" even
  // though the peer's real traffic/online state kept changing underneath.
  if(trafficChartInterval) clearInterval(trafficChartInterval);
  trafficChartInterval=setInterval(async()=>{
    if(!document.getElementById('peer-modal').classList.contains('open')||!trafficChart){
      clearInterval(trafficChartInterval);
      trafficChartInterval=null;
      return;
    }
    try{
      const fresh=await fetch('/api/peers/'+encodeURIComponent(p.public_key)+'/traffic').then(r=>r.ok?r.json():[]);
      if(fresh&&fresh.length){
        trafficChart.data.labels=fresh.map(x=>new Date((x.ts||x.t)*1000).toLocaleTimeString());
        trafficChart.data.datasets[0].data=fresh.map(x=>x.rx||0);
        trafficChart.data.datasets[1].data=fresh.map(x=>x.tx||0);
        trafficChart.update();
      }
    }catch(_){}
  },20000);
}

    const el=document.getElementById('system-logs-list');
    if(!el) return;
    if(!logs||!logs.length){el.innerHTML='<span style="color:var(--muted);font-size:13px">'+t('logs_empty')+'</span>';return;}
    el.innerHTML=logs.map(l=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface2);border-radius:6px;cursor:pointer"
           onclick="viewLog('${escapeHtml(l.path)}','${escapeHtml(l.name)}')">
        <span style="font-size:13px;font-family:monospace">${escapeHtml(l.name)}</span>
        <span style="font-size:12px;color:var(--muted);min-width:70px;text-align:right">${fmtBytes(l.size)}</span>
      </div>`).join('');
  }catch(e){
    const el=document.getElementById('system-logs-list');
    if(el) el.innerHTML='<span style="color:var(--muted);font-size:13px">'+t('logs_empty')+'</span>';
  }
}
async function viewLog(path,name){
  try{
    const r=await api('GET','/api/system/logs/view?path='+encodeURIComponent(path)+'&lines=200');
    document.getElementById('log-modal-title').textContent=name;
    document.getElementById('log-modal-content').textContent=(r.lines||[]).join('');
    const m=document.getElementById('log-modal');
    m.style.display='flex';
    m.onclick=function(e){if(e.target===m)closeLogModal();};
  }catch(e){toast(e.message,'err');}
}
function closeLogModal(){document.getElementById('log-modal').style.display='none';}

// ── SSL Status ─────────────────────────────────────────────────────────────
async function loadSslStatus(){
  try{
    const s=await api('GET','/api/settings');
    const el=document.getElementById('ssl-status-block');
    if(!el) return;
    if(s.ssl_active){
      el.innerHTML=`<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
        <span class="badge ok">✅ SSL Active</span>
        <span style="font-size:13px;color:var(--muted)">Domain: <b style="color:var(--text)">${escapeHtml(s.ssl_domain)}</b></span>
        ${s.ssl_expiry?`<span style="font-size:12px;color:var(--muted)">Expires: ${escapeHtml(s.ssl_expiry)}</span>`:''}
      </div>`;
    }else{
      el.innerHTML=`<span class="badge warn">⚠ Self-signed / Not configured</span>`;
    }
    // Pre-fill domain field
    const domInp=document.getElementById('ssl-domain');
    if(domInp && s.ssl_domain && !domInp.value) domInp.value=s.ssl_domain;
  }catch(e){}
}

// ── Modal ──────────────────────────────────────────────────────────────────

function openModal(title, body){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('peer-modal').classList.add('open');
}

function closeModal(){
  document.getElementById('peer-modal').classList.remove('open');
  if(trafficChartInterval){ clearInterval(trafficChartInterval); trafficChartInterval=null; }
}

// ── Add Peer ───────────────────────────────────────────────────────────────

function toggleExpiry(){
  const show=document.getElementById('p-use-expiry').checked;
  document.getElementById('expiry-row').style.display=show?'':'none';
}

async function addPeer(){
  try{
    const useExpiry=document.getElementById('p-use-expiry').checked;
    const expiry=useExpiry?document.getElementById('p-expiry').value:'';
    const r=await api('POST','/api/peers',{
      name:document.getElementById('p-name').value,
      allowed_ips:document.getElementById('p-ips').value||null,
      version:document.getElementById('p-version').value,
      intensity:document.getElementById('p-intensity').value,
      profile:document.getElementById('p-profile').value,
      browser_profile:document.getElementById('p-browser').value,
      junk_level:parseInt(document.getElementById('p-jc').value),
      use_psk:document.getElementById('p-use-psk').checked,
      router_mode:document.getElementById('p-router-mode').checked,
      use_extreme_max:document.getElementById('p-extreme-max').checked,
      expiry:expiry,
      // Advanced CPS
      custom_host:document.getElementById('p-host').value||'',
      mtu:parseInt(document.getElementById('p-mtu').value)||1280,
      use_tag_c:document.getElementById('p-tag-c').checked,
      use_tag_t:document.getElementById('p-tag-t').checked,
      use_tag_r:document.getElementById('p-tag-r').checked,
      use_tag_rc:document.getElementById('p-tag-rc').checked,
      use_tag_rd:document.getElementById('p-tag-rd').checked,
      use_browser_fp:document.getElementById('p-bfp').checked,
      mimic_all:document.getElementById('p-mimic-all').checked,
    });
    lastPeerConf=r.client_conf;
    lastPeerPub=r.public_key;
    lastPeerName=r.name;
    const block=document.getElementById('peer-conf-block');
    block.innerHTML='<button class="copy-btn" onclick="copyCode(\'peer-conf-block\')">Copy</button>'+escapeHtml(r.client_conf);
    document.getElementById('peer-params-grid').innerHTML=renderParams(flatParams(r.awg_params));
    document.getElementById('peer-result').style.display='block';
    document.getElementById('qr-area-new').style.display='none';
    toast(t('peer_created')+': '+r.name+' ✓');
  }catch(e){toast(e.message,'err');}
}

function downloadConf(){
  if(!lastPeerConf){toast(t('err_no_conf'),'err');return;}
  const blob=new Blob([lastPeerConf],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${lastPeerName||'peer'}.conf`;
  a.click();
}

async function showQRNew(){
  if(!lastPeerConf){toast(t('err_no_conf'),'err');return;}
  openModal('📱 QR Code: '+escapeHtml(lastPeerName||'peer'),
    `<div style="text-align:center;padding:20px;color:var(--muted)">${t('generating_qr')}</div>`);
  try{
    const r=await api('POST','/api/peer/qr_from_conf',{conf:lastPeerConf});
    document.getElementById('modal-body').innerHTML=
      `<div class="qr-container"><img src="${r.qr_base64}" alt="QR Code" style="max-width:320px;border-radius:8px;">`+
      `<p style="margin-top:12px;font-size:12px;color:var(--muted)">${t('qr_app_hint')}</p></div>`+
      `<div class="btn-group" style="justify-content:center;margin-top:12px">`+
      `<button class="btn btn-ghost btn-sm" onclick="downloadConf()">${t('btn_download_conf')}</button></div>`;
  }catch(e){
    document.getElementById('modal-body').innerHTML=`<p style="color:var(--danger)">QR error: `+escapeHtml(e.message)+`</p>`;
  }
}

// ── Settings ───────────────────────────────────────────────────────────────

async function loadSettingsForm(){
  try{
    const r=await api('GET','/api/settings');
    document.getElementById('s-new-user').value=r.username||'';
    document.getElementById('s-old-pass').value='';
    document.getElementById('s-new-pass').value='';
    document.getElementById('settings-msg').style.display='none';
    const sslMsg=document.getElementById('ssl-msg'); if(sslMsg) sslMsg.style.display='none';
  }catch(e){}
}

async function saveSettings(){
  const oldPass=document.getElementById('s-old-pass').value;
  const newUser=document.getElementById('s-new-user').value.trim();
  const newPass=document.getElementById('s-new-pass').value;
  const msgEl=document.getElementById('settings-msg');
  msgEl.style.display='none';
  if(!oldPass||!newUser||!newPass){
    msgEl.style.background='rgba(255,71,87,.1)';msgEl.style.border='1px solid #ff4757';
    msgEl.style.color='#ff4757';msgEl.textContent=t('settings_err_empty');msgEl.style.display='block';return;
  }
  try{
    const r=await api('POST','/api/settings',{old_password:oldPass,username:newUser,new_password:newPass});
    msgEl.style.background='rgba(46,213,115,.1)';msgEl.style.border='1px solid #2ed573';
    msgEl.style.color='#2ed573';msgEl.textContent=r.message||t('settings_saved');msgEl.style.display='block';
    setTimeout(()=>{ window.location.href='/login'; },1500);
  }catch(e){
    msgEl.style.background='rgba(255,71,87,.1)';msgEl.style.border='1px solid #ff4757';
    msgEl.style.color='#ff4757';msgEl.textContent=e.message;msgEl.style.display='block';
  }
}

// ── SSL ────────────────────────────────────────────────────────────────────

async function applySSL(mode){
  const domain=document.getElementById('ssl-domain').value.trim();
  const email=document.getElementById('ssl-email').value.trim();
  const msgEl=document.getElementById('ssl-msg');
  const btnSelf=document.getElementById('btn-ssl-self');
  const btnLe=document.getElementById('btn-ssl-le');
  if(mode==='letsencrypt'&&!domain){toast('Domain required','err');return;}
  btnSelf.disabled=true; btnLe.disabled=true;
  msgEl.style.display='none';
  toast(mode==='letsencrypt'?'Running certbot…':'Generating self-signed cert…');
  try{
    const r=await api('POST','/api/ssl/configure',{mode,domain,email});
    msgEl.style.cssText='display:block;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--success);border-radius:6px;padding:10px 14px;font-size:13px;';
    msgEl.textContent='✅ SSL applied: '+r.cert;
    loadSslStatus();
    toast('SSL updated ✓');
  }catch(e){
    msgEl.style.cssText='display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--danger);border-radius:6px;padding:10px 14px;font-size:13px;';
    msgEl.textContent='❌ '+e.message;
  }finally{
    btnSelf.disabled=false; btnLe.disabled=false;
  }
}

// ── Regen CPS ─────────────────────────────────────────────────────────────

async function regenCps(){
  const btn=document.getElementById('btn-regen-cps');
  if(btn){ btn.disabled=true; btn.textContent='…'; }
  try{
    const r=await api('POST','/api/server/regen_cps');
    if(r.cps_profile) document.getElementById('s-cps-profile').textContent=r.cps_profile;
    if(r.conf_params){
      const p=r.conf_params;
      document.getElementById('s-h1').textContent=p.H1||'—';
      document.getElementById('s-jc').textContent=p.Jc||'—';
      document.getElementById('s-jmin').textContent=p.Jmin||'—';
      document.getElementById('s-jmax').textContent=p.Jmax||'—';
    }
    toast('CPS regenerated'+(r.cps_profile?' — '+r.cps_profile:''));
  }catch(e){toast(e.message,'err');}
  finally{
    if(btn){ btn.disabled=false; btn.textContent='↻ Regen CPS'; }
  }
}

// ── Raw Config ─────────────────────────────────────────────────────────────

async function loadRawConf(){
  try{
    const r=await api('GET','/api/server/rawconf');
    const block=document.getElementById('raw-conf-block');
    block.innerHTML='<button class="copy-btn" onclick="copyCode(\'raw-conf-block\')">Copy</button>'+escapeHtml(r.conf||'(empty)');
  }catch(e){toast(e.message,'err');}
}

// ── Helpers ────────────────────────────────────────────────────────────────

function copyCode(id){
  const el=document.getElementById(id);
  // Get text excluding buttons
  const clone=el.cloneNode(true);
  clone.querySelectorAll('button').forEach(b=>b.remove());
  navigator.clipboard.writeText(clone.innerText.trim());
  toast(t('copied'));
}
</script>
